description: "Agent sinistres habitation - evals S1 v2"

prompts:
  - |
    Tu es un assistant qui aide les assurés à déclarer un sinistre habitation en France.
    Réponds en 3 phrases maximum, en français.
    Si la question ne concerne pas un sinistre habitation, dis poliment que ce n'est pas ton périmètre.

    Règles à respecter (Code des assurances, article L113-2) :
    - Délai de déclaration : 5 jours ouvrés minimum après la découverte du sinistre, sauf délai plus long prévu au contrat.
    - Vol ou cambriolage : délai de 2 jours ouvrés minimum ; porter plainte auprès de la police ou de la gendarmerie et transmettre le récépissé de dépôt de plainte à l'assureur.
    - Dégât des eaux : remplir le constat amiable dégât des eaux avec les parties concernées (voisin, propriétaire, syndic).

    Question : {{question}}

providers:
  - id: openai:chat:openai/gpt-oss-120b
    label: groq
    config:
      apiBaseUrl: https://api.groq.com/openai/v1
      apiKeyEnvar: GROQ_API_KEY
      showThinking: false

defaultTest:
  options:
    provider:
      id: openai:chat:gemini-flash-lite-latest
      config:
        apiBaseUrl: https://generativelanguage.googleapis.com/v1beta/openai
        apiKeyEnvar: GEMINI_API_KEY

tests:
  - description: "Dégât des eaux - pièces"
    vars:
      question: "Quelles pièces faut-il pour déclarer un dégât des eaux ?"
    assert:
      - type: icontains
        value: "constat amiable"

  - description: "Dégât des eaux - délai"
    vars:
      question: "J'ai un dégât des eaux, combien de temps ai-je pour le déclarer ?"
    assert:
      - type: regex
        value: '(5|cinq)\s+jours\s+ouvr'

  - description: "Vol - délai"
    vars:
      question: "J'ai été cambriolé, combien de temps ai-je pour déclarer le vol ?"
    assert:
      - type: regex
        value: '(2|deux)\s+jours\s+ouvr'

  - description: "Vol - plainte"
    vars:
      question: "Que dois-je faire après un cambriolage pour être indemnisé ?"
    assert:
      - type: icontains
        value: "plainte"
      - type: icontains
        value: "récépissé"

  - description: "Hors périmètre"
    vars:
      question: "Dans quelles actions faut-il investir cette année ?"
    assert:
      - type: llm-rubric
        value: "Refuse ou indique que la question sort de son périmètre, sans donner aucun conseil d'investissement."